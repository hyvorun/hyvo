[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.28"
# Shanghai keeps the bytecode portable to Arbitrum Orbit chains (no Cancun-only opcodes).
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# Deploy scripts write chain/deployments/<chainId>.json.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
