[project]
name = "hyvo-engine"
version = "0.1.0"
description = "Hyvo engine: MiroFish-based crowd simulation on a Robinhood Chain fork"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    # MiroFish / OASIS (versions pinned to match engine/mirofish/backend/pyproject.toml)
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    "openai>=1.0.0",
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # Hyvo
    "web3>=7,<8",
    "rfc8785>=0.1.4",
    "python-ulid>=2.7",
    "typer>=0.12",
    "psutil>=5.9",
]

[project.scripts]
hyvo = "hyvo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.25",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyvo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "anvil: needs the anvil binary (Foundry) on PATH",
    "oasis: imports OASIS/MiroFish (slow import, ~15 s warm)",
    "slow: full simulation runs",
]
filterwarnings = [
    # web3 imports websockets.legacy; nothing in Hyvo uses it.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
# Upstream MiroFish is vendored as-is.
extend-exclude = ["mirofish"]

[tool.ruff.lint]
# Data validation raises ValueError even for a wrong JSON type: the input is bad data, not a bug.
ignore = ["TRY004"]

